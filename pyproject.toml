[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-agent-resume-builder"
version = "0.1.0.dev0"
description = "Local-first, human-supervised job-application preparation system with no submission capability."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Anthony Grant" }
]
keywords = [
  "local-llm",
  "rag",
  "resume",
  "job-application",
  "playwright",
  "ollama",
  "safety",
  "human-in-the-loop"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed"
]
dependencies = [
  "chromadb>=1.0,<2.0",
  "email-validator>=2.2,<3.0",
  "httpx>=0.28,<1.0",
  "ollama>=0.4,<1.0",
  "playwright>=1.50,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "rich>=13.9,<15.0",
  "typer>=0.15,<1.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "pytest-cov>=6.0,<7.0",
  "pytest-playwright>=0.7,<1.0",
  "ruff>=0.9,<1.0",
  "types-PyYAML>=6.0.12.20241230"
]

[project.scripts]
web-agent-resume-builder = "web_agent_resume_builder.cli:app"
web-agent = "web_agent_resume_builder.cli:app"
wab = "web_agent_resume_builder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/web_agent_resume_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=web_agent_resume_builder --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["web_agent_resume_builder"]

[tool.coverage.report]
show_missing = true
skip_covered = false
